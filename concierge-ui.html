<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#090d12;color:#f8fafc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17323d55,transparent 35%),linear-gradient(180deg,#0b1017,#070a0f);min-height:100vh}.wrap{padding:18px;max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.mark{font-weight:900;letter-spacing:.12em;color:#d7ad52;font-size:12px}.room{font-size:12px;color:#8ee6ff;border:1px solid #264958;padding:7px 10px;border-radius:99px}.hero{padding:20px;border:1px solid #202a36;border-radius:22px;background:#111823cc;box-shadow:0 20px 60px #0008}.hero h1{margin:4px 0 7px;font-size:26px}.hero p{margin:0;color:#aeb8c5;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.card{border:1px solid #202a36;background:linear-gradient(145deg,#141c27,#0f151e);border-radius:18px;padding:16px;min-height:108px;text-align:left;color:#fff;cursor:pointer}.card:active{transform:scale(.985)}.ico{font-size:26px}.ttl{font-weight:800;margin-top:8px}.sub{font-size:11px;color:#8996a7;margin-top:3px;line-height:1.35}.panel{display:none;margin-top:14px;border:1px solid #263240;background:#111823;border-radius:20px;padding:18px}.panel.show{display:block}.back{border:0;background:#202b38;color:#fff;border-radius:12px;padding:9px 12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fact,.menu{background:#0b1118;border:1px solid #202a36;border-radius:14px;padding:12px}.fact small{display:block;color:#7e8a98;margin-bottom:5px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #334254;background:#16202c;color:#fff;padding:10px 12px;border-radius:99px}.chip.on{border-color:#d7ad52;color:#f4ce74}.cta{width:100%;border:0;border-radius:14px;padding:13px;background:linear-gradient(90deg,#d7ad52,#f0cd7a);font-weight:900;margin-top:12px}.ghost{background:#1a2430;color:#fff}.menurow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #202a36}.status{margin-top:10px;font-size:12px;color:#8ee6ff}textarea{width:100%;min-height:100px;background:#0a1017;color:#fff;border:1px solid #2b3949;border-radius:12px;padding:12px}.rates{display:flex;gap:6px;margin-bottom:10px}.rate{flex:1;padding:10px;border-radius:10px;border:1px solid #2b3949;background:#111923;color:#fff}.rate.on{border-color:#d7ad52;color:#f4ce74}@media(max-width:420px){.wrap{padding:12px}.card{min-height:102px;padding:14px}}
</style></head><body><div class="wrap"><div class="top"><div class="mark">HOTEL JP HILLS · AI CONCIERGE</div><div class="room" id="roomPill">Guest</div></div><div class="hero"><h1>Namaste 🙏</h1><p id="welcome">How can we make your stay better?</p><div class="grid" id="grid"></div><div class="panel" id="panel"></div></div></div><script>
const demo={brandName:"Hotel JP Hills, Rishikesh",room:"204",source:"Preview",welcome:"Namaste 🙏 How can we make your stay better?",wifi:{network:"JP Hills Guest",password:"••••••••"},breakfast:{time:"8:00 AM – 10:00 AM",location:"Restaurant"},rooftop:{cafeTime:"7:00 PM – 1:00 AM",musicTime:"6:00 PM – 10:30 PM",location:"4th Floor Rooftop Café"},lateCheckout:{options:["12:00 PM","1:00 PM","2:00 PM","Other"]},activities:{rafting:{summary:"Rafting assistance & current options."},kunjapuri:{summary:"Sunrise trip assistance."}},menu:{categories:[]},services:{cleaning:["Full room cleaning","Bathroom cleaning","Bedsheet change","Quick tidy-up"],towels:["2 fresh towels","4 fresh towels","Toiletries","Water bottles","Extra bedding"],manager:["Call me","Visit my room","I want to share something privately"],other:["Reception help","Maintenance","Food & Beverage","Travel desk","Other request"]}};
let D=demo,current=null,choice="",rating=0;
const cards=[["wifi","📶","Wi-Fi","Network & password"],["breakfast","🍳","Breakfast","Timing & location"],["cleaning","🧹","Room Cleaning","Request housekeeping"],["towels","🛁","Towels & Amenities","Towels, water, toiletries"],["rooftop","🌙","Rooftop Café","Timing & live music"],["rafting","🚣","Rafting","Explore & request"],["kunjapuri","🌄","Kunjapuri Trip","Sunrise assistance"],["menu","🍽️","Food Menu","Browse dishes"],["late_checkout","🕒","Late Checkout","Request extra time"],["feedback","⭐","My Experience","Share feedback"],["manager","👨‍💼","Talk to Manager","Private assistance"],["other","💬","Other Request","Anything else"]];
const $=s=>document.querySelector(s); const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function init(d){D={...demo,...d};$("#roomPill").textContent=D.room?("Room "+D.room):"Guest";$("#welcome").textContent=D.welcome||demo.welcome;renderCards()}
function renderCards(){$("#grid").style.display="grid";$("#panel").classList.remove("show");$("#grid").innerHTML=cards.map(c=>'<button class="card" data-id="'+c[0]+'"><div class="ico">'+c[1]+'</div><div class="ttl">'+c[2]+'</div><div class="sub">'+c[3]+'</div></button>').join("");document.querySelectorAll(".card").forEach(b=>b.onclick=()=>open(b.dataset.id))}
function open(id){current=id;choice="";rating=0;$("#grid").style.display="none";const p=$("#panel");p.classList.add("show");let h='<button class="back" id="back">← All services</button><h2>'+cards.find(x=>x[0]===id)[1]+' '+cards.find(x=>x[0]===id)[2]+'</h2>';
if(id==="wifi")h+='<div class="facts"><div class="fact"><small>Network</small><b>'+esc(D.wifi?.network)+'</b></div><div class="fact"><small>Password</small><b>'+esc(D.wifi?.password)+'</b></div></div>';
else if(id==="breakfast")h+='<div class="facts"><div class="fact"><small>Timing</small><b>'+esc(D.breakfast?.time)+'</b></div><div class="fact"><small>Location</small><b>'+esc(D.breakfast?.location)+'</b></div></div>';
else if(id==="rooftop")h+='<div class="facts"><div class="fact"><small>Café</small><b>'+esc(D.rooftop?.cafeTime)+'</b></div><div class="fact"><small>Live music</small><b>'+esc(D.rooftop?.musicTime)+'</b></div></div><div class="fact" style="margin-top:9px"><small>Location</small><b>'+esc(D.rooftop?.location)+'</b></div>';
else if(id==="menu"){const cats=D.menu?.categories||[];h+=cats.length?cats.map(c=>'<div class="menu"><b>'+esc(c.name)+'</b>'+(c.items||[]).map(i=>'<div class="menurow"><span>'+esc(i.name)+'</span><b>'+esc(i.price)+'</b></div>').join("")+'</div>').join(""):'<p>Menu will be available here shortly.</p>'}
else if(id==="rafting"||id==="kunjapuri")h+='<p>'+esc(D.activities?.[id]?.summary||"Tell ChatGPT what you need.")+'</p><button class="cta" id="ask">Ask ChatGPT about this</button>';
else if(id==="feedback")h+='<div class="rates">'+[1,2,3,4,5].map(n=>'<button class="rate" data-r="'+n+'">'+n+'★</button>').join("")+'</div><textarea id="fb" placeholder="What went well? What can we improve?"></textarea><button class="cta" id="sendFb">Send feedback</button><div class="status" id="st"></div>';
else {const opts=id==="late_checkout"?(D.lateCheckout?.options||[]):((D.services||{})[id]||[]);h+='<div class="chips">'+opts.map((x,i)=>'<button class="chip" data-c="'+i+'">'+esc(x)+'</button>').join("")+'</div><button class="cta" id="send">Send request</button><button class="cta ghost" id="chat">Tell ChatGPT more</button><div class="status" id="st"></div>'}
p.innerHTML=h;$("#back").onclick=renderCards;bind()}
function bind(){document.querySelectorAll(".chip").forEach((b,i)=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");const opts=current==="late_checkout"?(D.lateCheckout?.options||[]):((D.services||{})[current]||[]);choice=opts[i]});document.querySelectorAll(".rate").forEach(b=>b.onclick=()=>{rating=+b.dataset.r;document.querySelectorAll(".rate").forEach(x=>x.classList.toggle("on",x===b))});$("#ask")?.addEventListener("click",()=>follow("I want help with "+current+(D.room?" for room "+D.room:"")+". Please guide me and only send an enquiry after I confirm."));$("#chat")?.addEventListener("click",()=>follow("I need help with "+current+(D.room?" for room "+D.room:"")+". Ask me what you need."));$("#send")?.addEventListener("click",sendReq);$("#sendFb")?.addEventListener("click",sendFb)}
async function sendReq(){const st=$("#st");if(!choice&&current!=="manager"){st.textContent="Choose an option first.";return}if(!D.room){follow("I want "+(choice||current)+". Please ask my room number, then confirm before sending.");return}try{st.textContent="Sending…";const out=await call("create_service_request",{service:current,room:String(D.room),details:choice||"Guest requests manager assistance",source:D.source||"ChatGPT",consent_to_share:true});st.textContent="Sent ✓ "+(out?.structuredContent?.ticketId||"")}catch(e){st.textContent="Could not send. Please tell ChatGPT."}}
async function sendFb(){const txt=$("#fb").value.trim(),st=$("#st");if(!rating||!txt){st.textContent="Choose a rating and add a comment.";return}try{st.textContent="Sending…";const out=await call("submit_guest_feedback",{rating,comment:txt,room:String(D.room||""),source:D.source||"ChatGPT",consent_to_share:true});st.textContent="Thank you ✓ "+(out?.structuredContent?.ticketId||"")}catch(e){st.textContent="Could not send feedback."}}
async function call(name,args){if(window.openai?.callTool)return window.openai.callTool(name,args);throw new Error("Tool bridge unavailable")}
async function follow(prompt){if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt})}
init(window.openai?.toolOutput||demo);
</script></body></html>
